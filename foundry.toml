[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "solar"
optimizer = true
optimizer_runs = 200
# FVM rebuilds its jumpdest table every call, walking the CBOR trailer as if it were opcodes
bytecode_hash = "none"
cbor_metadata = false

remappings = [
    'forge-std/=lib/forge-std/src/',
    'solady/=lib/solady/src/',
]

[lint]
severity = ["high", "med", "low", "info", "gas", "code-size"]
exclude_lints = [
    "arbitrary-send-erc20",
    "calls-loop",
    "cyclomatic-complexity",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "missing-events-access-control",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "todo-comment",
    "unsafe-typecast",
]
