[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.37"
optimizer = true
optimizer_runs = 200

remappings = [
    'forge-std/=lib/forge-std/src/',
]

[lint]
severity = ["high", "med", "low", "info", "gas", "code-size"]
exclude_lints = [
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "reentrancy-events",
    "require-revert-in-loop",
    "todo-comment",
    "unsafe-typecast",
]
