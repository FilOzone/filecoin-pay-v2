name: Clients

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ts:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22, 24, 26]

    defaults:
      run:
        working-directory: clients/ts

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          working-directory: clients/ts
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check package
        run: pnpm check:package

  abi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
          cache: true

      - name: Generate ABI
        run: node clients/ts/scripts/generate-abi.mjs

      - name: Check ABI
        run: git diff --exit-code -- clients/ts/src/abi
