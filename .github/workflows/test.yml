name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
          cache: true

      - name: Build
        run: forge build

      - name: Test
        run: forge test

      - name: Check vectors
        run: |
          forge script script/ScriptVectors.s.sol
          git ls-files --error-unmatch vectors/script.json
          git diff --exit-code -- vectors/
